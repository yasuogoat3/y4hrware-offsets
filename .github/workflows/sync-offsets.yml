name: Sync Roblox offsets

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: offsets-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download and validate offsets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 45 \
            https://offsets.imtheo.lol/Offsets/FFlags.json \
            --output FFlags.next.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('FFlags.next.json', 'utf8'));
          if (typeof data['Roblox Version'] !== 'string' ||
              !data['Roblox Version'].startsWith('version-') ||
              !Number.isInteger(data['Total Offsets']) ||
              data['Total Offsets'] <= 0 ||
              !data.FFlagOffsets ||
              typeof data.FFlagOffsets !== 'object') {
            throw new Error('Downloaded offset file failed validation');
          }
          NODE
          mv FFlags.next.json FFlags.json

      - name: Publish changes
        shell: bash
        run: |
          if git diff --quiet -- FFlags.json; then
            echo "Offsets are already current."
            exit 0
          fi
          VERSION="$(node -p "require('./FFlags.json')['Roblox Version']")"
          git config user.name "Y4hrware Offset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add FFlags.json
          git commit -m "chore: sync offsets for ${VERSION}"
          git push
